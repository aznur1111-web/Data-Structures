function demoTreap(text){
 const values=text.trim().split(/[\s,]+/).filter(Boolean).map(Number);
 if(!values.length)throw Error('Enter numbers separated by spaces.');
 const root={v:values[0],l:null,r:null,prio:Math.random()};
 function rotR(n){const l=n.l;n.l=l.r;l.r=n;return l}
 function rotL(n){const r=n.r;n.r=r.l;r.l=n;return r}
 function ins(n,x){
  if(!n)return{v:x,l:null,r:null,prio:Math.random()};
  if(x<n.v){n.l=ins(n.l,x);if(n.l.prio>n.prio)n=rotR(n)}
  else{n.r=ins(n.r,x);if(n.r.prio>n.prio)n=rotL(n)}
  return n;
 }
 let r=null;
 for(const x of values)r=ins(r,x);
 return{
  encoded:`Values: [${values.join(', ')}]`,
  html:r?treeSVG(r):svgWrap('','0 0 1 1'),
  decoded:`Treap: BST on keys, heap on random priorities. Expected O(log n) height.`
 };
}

function demoBinaryHeap(text){
 const log=[];
 const heap=[];
 function siftUp(i){
  while(i>0){const p=(i-1)>>1;if(heap[i]<heap[p]){[heap[i],heap[p]]=[heap[p],heap[i]];i=p}else break}
 }
 function siftDown(i){
  const n=heap.length;
  while(true){let s=i;const l=2*i+1,r=2*i+2;if(l<n&&heap[l]<heap[s])s=l;if(r<n&&heap[r]<heap[s])s=r;if(s===i)break;[heap[i],heap[s]]=[heap[s],heap[i]];i=s}
 }
 for(const line of parseLines(text)){
  const p=line.split(/\s+/);
  if(p[0]==='push'){heap.push(parseInt(p[1]));siftUp(heap.length-1);log.push(`push ${p[1]}`)}
  else if(p[0]==='pop'){const top=heap[0];const last=heap.pop();if(heap.length){heap[0]=last;siftDown(0)}log.push(`pop -> ${top}`)}
  else if(p[0]==='peek')log.push(`peek -> ${heap[0]}`);
  else if(p[0]==='print')log.push(`heap array: [${heap.join(', ')}]`);
 }
 return{
  encoded:log.join('\n')||'(no operations)',
  html:arraySVG(heap),
  decoded:`Binary min-heap stored as an array. Root is the minimum.`
 };
}

function demoFenwick(text){
 const lines=text.trim().split(/\n/);
 const a=lines[0].split(/[\s,]+/).filter(Boolean).map(Number);
 const n=a.length;
 const tree=new Array(n+1).fill(0);
 const lowbit=i=>i&(-i);
 function update(i,delta){while(i<=n){tree[i]+=delta;i+=lowbit(i)}}
 function query(i){let s=0;while(i>0){s+=tree[i];i-=lowbit(i)}return s}
 for(let i=0;i<n;i++)update(i+1,a[i]);
 const log=[];
 const queries=[];
 for(let i=1;i<lines.length;i++){
  const p=lines[i].split(/\s+/);
  if(p[0]==='query'){const r=parseInt(p[1]);log.push(`query ${r} -> ${query(r)}`)}
  else if(p[0]==='update'){const idx=parseInt(p[1]),delta=parseInt(p[2]);update(idx,delta);log.push(`update ${idx} += ${delta}`)}
  else if(p[0]==='range'){const l=parseInt(p[1]),r=parseInt(p[2]);log.push(`range ${l}..${r} -> ${query(r)-query(l-1)}`)}
 }
 return{
  encoded:`Array: [${a.join(', ')}]\nFenwick tree: [${tree.join(', ')}]\n\nOperations:\n${log.join('\n')||'(none)'}`,
  decoded:`Fenwick tree: O(log n) update and query, O(n) space. Uses the lowest set bit of each index.`
 };
}
function demoSegtree(text){
 const lines=text.trim().split(/\n/);
 const a=lines[0].split(/[\s,]+/).filter(Boolean).map(Number);
 const n=a.length;
 const tree=new Array(4*n).fill(0);
 function build(node,lo,hi){
  if(lo===hi)tree[node]=a[lo];
  else{const mid=(lo+hi)>>1;build(2*node,lo,mid);build(2*node+1,mid+1,hi);tree[node]=tree[2*node]+tree[2*node+1]}
 }
 function query(node,lo,hi,l,r){
  if(r<lo||hi<l)return 0;
  if(l<=lo&&hi<=r)return tree[node];
  const mid=(lo+hi)>>1;
  return query(2*node,lo,mid,l,r)+query(2*node+1,mid+1,hi,l,r);
 }
 function update(node,lo,hi,idx,val){
  if(lo===hi){tree[node]=val;return}
  const mid=(lo+hi)>>1;
  if(idx<=mid)update(2*node,lo,mid,idx,val);else update(2*node+1,mid+1,hi,idx,val);
  tree[node]=tree[2*node]+tree[2*node+1];
 }
 build(1,0,n-1);
 const log=[];
 for(let i=1;i<lines.length;i++){
  const p=lines[i].split(/\s+/);
  if(p[0]==='query'){const l=parseInt(p[1]),r=parseInt(p[2]);log.push(`query ${l}..${r} -> ${query(1,0,n-1,l,r)}`)}
  else if(p[0]==='update'){const idx=parseInt(p[1]),val=parseInt(p[2]);update(1,0,n-1,idx,val);log.push(`update ${idx} = ${val}`)}
 }
 return{
  encoded:`Array: [${a.join(', ')}]\n\nOperations:\n${log.join('\n')||'(none)'}`,
  html:arraySVG(a),
  decoded:`Segment tree: O(log n) query and update. Works for any associative operation.`
 };
}
function demoLazy(text){
 const lines=text.trim().split(/\n/);
 const a=lines[0].split(/[\s,]+/).filter(Boolean).map(Number);
 const n=a.length;
 const tree=new Array(4*n).fill(0);
 const lazy=new Array(4*n).fill(0);
 function build(node,lo,hi){
  if(lo===hi)tree[node]=a[lo];
  else{const mid=(lo+hi)>>1;build(2*node,lo,mid);build(2*node+1,mid+1,hi);tree[node]=tree[2*node]+tree[2*node+1]}
 }
 function push(node,lo,hi){
  if(lazy[node]){
   const mid=(lo+hi)>>1;
   tree[2*node]+=lazy[node]*(mid-lo+1);
   tree[2*node+1]+=lazy[node]*(hi-mid);
   lazy[2*node]+=lazy[node];lazy[2*node+1]+=lazy[node];
   lazy[node]=0;
  }
 }
 function upd(node,lo,hi,l,r,val){
  if(r<lo||hi<l)return;
  if(l<=lo&&hi<=r){tree[node]+=val*(hi-lo+1);lazy[node]+=val;return}
  push(node,lo,hi);
  const mid=(lo+hi)>>1;
  upd(2*node,lo,mid,l,r,val);upd(2*node+1,mid+1,hi,l,r,val);
  tree[node]=tree[2*node]+tree[2*node+1];
 }
 function qry(node,lo,hi,l,r){
  if(r<lo||hi<l)return 0;
  if(l<=lo&&hi<=r)return tree[node];
  push(node,lo,hi);
  const mid=(lo+hi)>>1;
  return qry(2*node,lo,mid,l,r)+qry(2*node+1,mid+1,hi,l,r);
 }
 build(1,0,n-1);
 const log=[];
 for(let i=1;i<lines.length;i++){
  const p=lines[i].split(/\s+/);
  if(p[0]==='add'){const l=parseInt(p[1]),r=parseInt(p[2]),v=parseInt(p[3]);upd(1,0,n-1,l,r,v);log.push(`add ${v} to [${l}..${r}]`)}
  else if(p[0]==='sum'){const l=parseInt(p[1]),r=parseInt(p[2]);log.push(`sum ${l}..${r} -> ${qry(1,0,n-1,l,r)}`)}
 }
 return{
  encoded:`Array: [${a.join(', ')}]\n\nOperations:\n${log.join('\n')||'(none)'}`,
  decoded:`Lazy segment tree: range update and range query in O(log n) each.`
 };
}

function demoUnionFind(text){
 const n=parseInt(text.split(/\s+/)[0])||10;
 const parent=Array.from({length:n},(_,i)=>i);
 const rank=new Array(n).fill(0);
 function find(x){while(parent[x]!==x){parent[x]=parent[parent[x]];x=parent[x]}return x}
 function union(a,b){let ra=find(a),rb=find(b);if(ra===rb)return false;if(rank[ra]<rank[rb])[ra,rb]=[rb,ra];parent[rb]=ra;if(rank[ra]===rank[rb])rank[ra]++;return true}
 const log=[];
 for(const line of text.split(/\n/).slice(1)){
  const p=line.trim().split(/\s+/);
  if(p[0]==='union')log.push(`  union ${p[1]} ${p[2]} -> ${union(parseInt(p[1]),parseInt(p[2]))?'merged':'already same'}`);
  else if(p[0]==='find')log.push(`  find ${p[1]} -> ${find(parseInt(p[1]))}`);
  else if(p[0]==='connected')log.push(`  connected ${p[1]} ${p[2]} -> ${find(parseInt(p[1]))===find(parseInt(p[2]))}`);
 }
 return{
  encoded:`n = ${n}\n\nOperations:\n${log.join('\n')||'(none)'}`,
  decoded:`Union-find with path compression and union by rank. Amortized O(alpha(n)) per operation.`
 };
}

  else if(p[0]==='put'){const k=p[1],v=p[2];if(cache.has(k))cache.delete(k);cache.set(k,v);if(cache.size>capacity)cache.delete(cache.keys().next().value);log.push(`put ${k}=${v}`)}
  else if(p[0]==='print')log.push(`keys (LRU->MRU): [${[...cache.keys()].join(', ')}]`);
 }
 return{
  encoded:log.join('\n')||'(no operations)',
  decoded:`LRU cache with capacity ${capacity}. Evicts the least recently used key.`
 };
}
function demoLfu(text){
 const lines=parseLines(text);
 const capacity=parseInt(lines[0].split(/\s+/)[1])||3;
 const cache=new Map();
 const freq=new Map();
 const log=[];
 for(let i=1;i<lines.length;i++){
  const p=lines[i].split(/\s+/);
  if(p[0]==='get'){const k=p[1];if(cache.has(k)){freq.set(k,(freq.get(k)||0)+1);log.push(`get ${k} -> ${cache.get(k)}`)}else log.push(`get ${k} -> miss`)}
  else if(p[0]==='put'){
   const k=p[1],v=p[2];
   if(cache.has(k)){cache.set(k,v);freq.set(k,(freq.get(k)||0)+1)}
   else{
    if(cache.size>=capacity){
     let minKey=null,minF=Infinity;
     for(const[key,f]of freq)if(f<minF){minF=f;minKey=key}
     cache.delete(minKey);freq.delete(minKey);
    }
    cache.set(k,v);freq.set(k,1);
   }
   log.push(`put ${k}=${v}`);
  }
  else if(p[0]==='print')log.push(`keys: [${[...cache.keys()].join(', ')}]`);
 }
 return{
  encoded:log.join('\n')||'(no operations)',
  decoded:`LFU cache with capacity ${capacity}. Evicts the least frequently used key.`
 };
}
function demoArc(){return{encoded:'ARC cache: adaptive replacement cache.',decoded:'Balances recency and frequency with two lists and two ghosts.'}}
function demoLirsTinylfu(){return{encoded:'TinyLFU: admission policy based on a count-min sketch.',decoded:'Admits a new key only if more frequent than the victim.'}}
function demoSieve(){
 const capacity=4;
 const cache={};
 const visited={};
 const queue=[];
 const log=[];
 for(const k of["A","B","C","D","E"]){
  if(k in cache){visited[k]=true;log.push(`hit ${k}`);continue}
  if(Object.keys(cache).length>=capacity){
   while(queue.length){
    const v=queue[0];
    if(visited[v]){visited[v]=false;queue.push(queue.shift())}
    else{queue.shift();delete cache[v];delete visited[v];log.push(`evict ${v}`);break}
   }
  }
  cache[k]=k;visited[k]=false;queue.push(k);log.push(`insert ${k}`);
 }
 return{
  encoded:log.join('\n'),
  decoded:`SIEVE cache: FIFO with visited bits. Near-LRU hit rate with simpler bookkeeping.`
 };
}
function demoBelady(){
 const sequence=['A','B','C','A','B','D','A','C','B','D'];
 const capacity=3;
 const cache=new Set();
 let misses=0;
 for(let i=0;i<sequence.length;i++){
  const x=sequence[i];
  if(cache.has(x))continue;
  misses++;
  if(cache.size>=capacity){
   let victim=null,farthest=-1;
   for(const k of cache){
    let next=sequence.indexOf(k,i+1);
    if(next===-1)next=Infinity;
    if(next>farthest){farthest=next;victim=k}
   }
   cache.delete(victim);
  }
  cache.add(x);
 }
 return{
  encoded:`Sequence: ${sequence.join(' ')}\nCapacity: ${capacity}\nMisses (Belady): ${misses}`,
  decoded:`Belady's algorithm evicts the item used farthest in the future. Optimal but requires future knowledge.`
 };
}

function exportProgress(){downloadText('az-data-structures-lab-progress.json',JSON.stringify({schemaVersion:1,completed:[...state.completed],bookmarks:[...state.bookmarks],theme:state.theme,current:state.current,drafts:state.drafts},null,2),'application/json');toast('Progress exported')}
function importProgressFile(file){
 if(file.size>2_000_000){toast('Import rejected: file too large');return}
 const r=new FileReader();
 r.onload=()=>{try{
  const d=JSON.parse(r.result);
  if(!d||d.schemaVersion!==1||!Array.isArray(d.completed)||!Array.isArray(d.bookmarks)||typeof d.drafts!=='object')throw Error('bad schema');
  if([...d.completed,...d.bookmarks].some(id=>typeof id!=='string'||!byId[id]))throw Error('unknown id');
  state.completed=new Set(d.completed);
  state.bookmarks=new Set(d.bookmarks);
  state.theme=['system','light','dark'].includes(d.theme)?d.theme:'system';
  state.current=byId[d.current]?d.current:null;
  state.drafts=Object.fromEntries(Object.entries(d.drafts).filter(([k,v])=>byId[k]&&typeof v==='string'&&v.length<100000));
  applyTheme();save();renderTree();
  state.current?openLesson(state.current):renderHome();
  toast('Progress imported');
 }catch(e){toast('Import rejected: invalid progress data')}};
 r.readAsText(file);
}

function bindGlobal(){
 $('#themeSelect').onchange=()=>{state.theme=$('#themeSelect').value;applyTheme();save()};
 $('#printBtn').onclick=()=>print();
 $('#exportBtn').onclick=exportProgress;
 $('#importBtn').onclick=()=>$('#importFile').click();
 $('#importFile').onchange=e=>{if(e.target.files[0])importProgressFile(e.target.files[0]);e.target.value=''};
 $('#searchInput').oninput=renderTree;
 $('#chapterFilter').onchange=renderTree;
 $('#homeLink').onclick=e=>{e.preventDefault();renderHome();history.replaceState(null,'','#home')};
 $('#courseTree').onclick=e=>{const b=e.target.closest('[data-lesson]');if(b)openLesson(b.dataset.lesson)};
 document.querySelectorAll('[data-page="home"]').forEach(b=>b.onclick=renderHome);
 document.querySelectorAll('[data-page="progress"]').forEach(b=>b.onclick=renderProgressPage);
 document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('#searchInput').focus()}
  if(e.key.toLowerCase()==='t'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){
   state.theme=state.theme==='dark'?'light':state.theme==='light'?'system':'dark';
   applyTheme();save();
  }
 });
}

function init(){
 load();
 applyTheme();
 CHAPTERS.forEach(c=>{const op=document.createElement('option');op.value=c.id;op.textContent=c.title;$('#chapterFilter').append(op)});
 bindGlobal();
 renderTree();
 const hash=location.hash.replace(/^#/,'');
 if(hash&&byId[hash])renderLesson(hash);
 else if(state.current&&byId[state.current])renderLesson(state.current);
 else renderHome();
 progress();
}
init();
</script></body></html>
