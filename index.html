 steps:["Each node has a value and a next pointer.","Head points to the first node.","Insert after node p: new.next = p.next; p.next = new.","Delete after node p: p.next = p.next.next.","Traverse by following next pointers."],
 pseudo:"Singly linked list node:\n  value\n  next -> Node or null\n\nOperations:\n  insert at head       O(1)\n  insert after node p  O(1)\n  delete after node p  O(1)\n  search x             O(n)\n  access k-th          O(n)\n\nDoubly linked list:\n  each node has prev and next\n  supports O(1) delete given a node\n  supports backward traversal\n\nSingly vs doubly:\n  singly: half the memory, one direction\n  doubly: O(1) delete at any node, more memory",
 invariant:"The list must be well-formed: head is null or a valid node. Every node's next points to a valid node or null.",
 uses:"LRU caches, adjacency lists, hash table chaining, undo stacks, language runtime containers.",
 strength:"O(1) insertion and deletion at known positions. No preallocation needed.",
 limits:"Poor cache locality. O(n) search. Pointer overhead.",
 pitfall:"Forgetting to update head when inserting at the front. Forgetting to update prev pointers in a doubly linked list causes corruption.",
 question:"Why is a doubly linked list preferred for LRU caches?",
 answer:"An LRU cache needs O(1) delete of any node when a key is accessed. A doubly linked list allows that because each node knows its predecessor.",
 demo:"linked-list",sample:"push 5\npush 3\npush 8\npush 1\npop\nprint\nsearch 3\nprint",refs:[
  ["CLRS, Chapter 10 Elementary Data Structures","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"],
  ["Knuth, TAOCP Vol. 1, Section 2.2.3","https://www-cs-faculty.stanford.edu/~knuth/taocp.html"],
  ["Wikipedia, Linked list","https://en.wikipedia.org/wiki/Linked_list"]]},
{id:"stacks-queues",title:"Stacks and queues",level:1,kind:"Abstract data type",status:"Runnable teaching lab",
 summary:"A stack is last-in first-out (LIFO). A queue is first-in first-out (FIFO). Both support push and pop in O(1). They differ in which end elements leave.",
 mental:"Stack: a pile of plates. Queue: a line at a checkout",
 mentalText:"The stack removes from the top, the most recently added. The queue removes from the front, the earliest added.",
 steps:["Push adds an element.","Pop removes and returns the appropriate element.","Stack pops from the top.","Queue pops from the front."],
 pseudo:"Stack (LIFO):\n  push(x)  O(1)   add to top\n  pop()    O(1)   remove from top\n  peek()   O(1)\n\nQueue (FIFO):\n  enqueue(x)  O(1)   add to back\n  dequeue()   O(1)   remove from front\n  front()     O(1)\n\nImplementation options:\n  array-based (with head/tail indices)\n  linked list based\n  for queue: circular buffer avoids shifting\n\nApplications of stack:\n  function calls (recursion)\n  expression evaluation\n  backtracking\n  undo/redo\n\nApplications of queue:\n  BFS\n  task scheduling\n  producer-consumer\n  message buffers",
 invariant:"Stack: the top pointer must always be valid. Queue: head must not pass tail (unless circular).",
 uses:"Parsing, BFS, DFS, undo stacks, task queues, message brokers.",
 strength:"Simple. O(1) operations.",
 limits:"Neither supports random access in O(1).",
 pitfall:"Using an array-based queue without a circular buffer makes dequeue O(n).",
 question:"Which data structure would you use for a BFS traversal?",
 answer:"A queue. BFS needs to process nodes in the order they were discovered, which is FIFO.",
 demo:"stack-queue",sample:"push 1\npush 2\npop\npush 3\nprint\n\nenqueue 1\nenqueue 2\ndequeue\nenqueue 3\nprint",refs:[
  ["CLRS, Chapter 10 Elementary Data Structures","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"],
  ["Sedgewick and Wayne, Algorithms, Section 1.3","https://algs4.cs.princeton.edu/home/"],
  ["Wikipedia, Stack (abstract data type)","https://en.wikipedia.org/wiki/Stack_(abstract_data_type)"]]},
{id:"deques-circular",title:"Deques and circular buffers",level:2,kind:"Abstract data type",status:"Runnable teaching lab",
 summary:"A deque (double-ended queue) supports push and pop at both ends in O(1). A circular buffer is a fixed-size deque that overwrites the oldest element when full.",
 mental:"A line where you can join or leave from either end",
 mentalText:"A deque is like a queue with doors at both ends. A circular buffer is a deque that wraps around when it reaches the end of the array.",
 steps:["Maintain head and tail indices.","Push front: decrement head (mod capacity) and write.","Push back: write at tail and increment tail.","Pop front or pop back by adjusting the appropriate index.","When full, either reject or overwrite the oldest."],
 pseudo:"Deque (array-based):\n  ring of size capacity\n  head, tail, size\n\n  push_front(x):\n    head = (head - 1 + capacity) % capacity\n    buf[head] = x; size += 1\n\n  push_back(x):\n    buf[tail] = x\n    tail = (tail + 1) % capacity\n    size += 1\n\n  pop_front():\n    x = buf[head]\n    head = (head + 1) % capacity\n    size -= 1\n    return x\n\n  pop_back():\n    tail = (tail - 1 + capacity) % capacity\n    x = buf[tail]\n    size -= 1\n    return x\n\nAll operations O(1).\n\nCircular buffer = fixed-size deque with overwrite policy.\nUsed for logging, streaming, producer-consumer.",
 invariant:"The head and tail wrap modulo the capacity. Size must never exceed capacity in a non-overwriting buffer.",
 uses:"Sliding window, streaming data, UDP buffers, audio processing, keyboard buffers.",
 strength:"O(1) at both ends. Fixed memory. Cache-friendly when the buffer fits in cache.",
 limits:"Capacity is fixed unless you reallocate.",
 pitfall:"Forgetting to wrap head and tail modulo capacity causes out-of-bounds or lost data.",
 question:"Why is a circular buffer ideal for streaming logs?",
 answer:"It keeps the last N events in fixed memory. Old events are automatically overwritten.",
 demo:"deque",sample:"push_back 1\npush_back 2\npush_front 0\npop_back\npop_front\nprint",refs:[
  ["Knuth, TAOCP Vol. 1, Section 2.2.2","https://www-cs-faculty.stanford.edu/~knuth/taocp.html"],
  ["Wikipedia, Double-ended queue","https://en.wikipedia.org/wiki/Double-ended_queue"],
  ["Wikipedia, Circular buffer","https://en.wikipedia.org/wiki/Circular_buffer"]]},

{id:"hash-tables",title:"Hash tables",level:2,kind:"Foundation",status:"Runnable teaching lab",
 summary:"A hash table maps keys to values with average O(1) lookup. Collisions are handled by chaining or open addressing.",
 mental:"A wall of numbered mailboxes",
 mentalText:"The hash function computes the mailbox number. Two keys can collide, so the box must handle overflow.",
 steps:["Compute hash(key).","Reduce to an index with a modulo or a mask.","Look up the bucket.","Handle collisions by chaining or probing."],
 pseudo:"Chaining:\n  buckets[m] each holds a list\n  insert: append to list at hash(key) mod m\n  lookup: scan the list\n\nOpen addressing:\n  probe sequence h(k, 0), h(k, 1), ...\n  linear:    (h(k) + i) mod m\n  quadratic: (h(k) + c1 i + c2 i^2) mod m\n  double:    (h1(k) + i h2(k)) mod m\n\nLoad factor alpha = n / m\n  chaining: O(1 + alpha)\n  open addressing: cost rises fast beyond alpha ~ 0.75\n\nResize when alpha exceeds threshold:\n  allocate new table twice the size\n  rehash all keys",
 invariant:"Every key must be found by exactly the probe sequence used at insertion. Deletion in open addressing needs tombstones.",
 uses:"Dictionaries, caches, sets, database indexes, deduplication, symbol tables.",
 strength:"Average O(1) operations. Simple and widely used.",
 limits:"Worst-case O(n). Not ordered. Requires a good hash function.",
 pitfall:"Deleting from an open-addressed table by clearing the slot breaks lookups for keys inserted after a collision.",
 question:"Why does open addressing need tombstones on deletion?",
 answer:"A probe stops at the first empty slot. If a deleted slot becomes empty, keys that probed past it are lost.",
 demo:"hash-table",sample:"put apple 5\nput banana 7\nput cherry 9\nget banana\ndelete apple\nget apple\nprint",refs:[
  ["CLRS, Chapter 11 Hash Tables","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"],
  ["Knuth, TAOCP Vol. 3, Section 6.4","https://www-cs-faculty.stanford.edu/~knuth/taocp.html"],
  ["Wikipedia, Hash table","https://en.wikipedia.org/wiki/Hash_table"]]},
{id:"hash-sets",title:"Hash sets and membership",level:2,kind:"Abstract data type",status:"Runnable teaching lab",
 summary:"A hash set stores keys with no values. Membership, insertion and deletion are O(1) average. It is the standard tool for deduplication and set operations.",
 mental:"A hash table with no values",
 mentalText:"The same structure as a hash table, but the value is just the presence of the key.",
 steps:["Hash the key.","Look in the bucket.","Return whether the key is present.","Insert or delete as needed."],
 pseudo:"Set operations:\n  add(k)      O(1)\n  remove(k)   O(1)\n  contains(k) O(1)\n\nSet algebra:\n  union        O(n + m)\n  intersection O(min(n, m))\n  difference   O(n)\n  subset test  O(n)\n\nImplementation:\n  wrap a hash table with value = True\n  or use a dedicated hash set implementation",
 uses:"Deduplication, membership tests, set algebra, graph algorithms.",
 strength:"O(1) average operations. Simple.",
 limits:"Not ordered. Cannot iterate in sorted order.",
 pitfall:"Iterating a hash set gives arbitrary order. If order matters, sort the result or use a linked hash set.",
 question:"Why is a hash set preferred over a sorted array for membership tests?",
 answer:"Hash set membership is O(1) average; a sorted array is O(log n) and requires the array to stay sorted under insertion.",
 demo:"hash-set",sample:"add A\nadd B\nadd C\nadd A\ncontains B\ncontains D\nremove A\nprint",refs:[
  ["CLRS, Chapter 11 Hash Tables","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"],
  ["Cormen, Leiserson, Rivest, Stein, Introduction to Algorithms","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"],
  ["Python set documentation","https://docs.python.org/3/library/stdtypes.html#set-types-set-frozenset"]]},
{id:"bloom-filters",title:"Bloom filters",level:3,kind:"Probabilistic",status:"Runnable teaching lab",
 summary:"A Bloom filter answers set membership with no false negatives but possible false positives. It uses a bit array and k hash functions.",
 mental:"A compact yes-probably list",
 mentalText:"If the filter says no, the item is definitely absent. If it says yes, the item is probably present.",
 steps:["Allocate m bits, all zero.","For each insertion, set k bits from k hash functions.","For a query, check the same k bits.","All set means probably present; any unset means definitely absent."],
 pseudo:"Bloom filter with m bits and k hash functions:\n  insert(x):\n    for i in 1..k: set bit h_i(x)\n  query(x):\n    for i in 1..k: if not bit h_i(x) return False\n    return True  # probably present\n\nFalse positive rate:\n  (1 - e^(-kn/m))^k\n\nOptimal k: (m/n) ln 2\n\nBits per item for target rate p:\n  m/n = -log2(p) / ln 2\n\nMemory: 9.6 bits per item for 1% false positive rate.",
 invariant:"A Bloom filter never gives a false negative. Bits are only set, never cleared in the standard version.",
 uses:"Databases (LSM-tree lookups), caches, malware scanning, distributed set reconciliation, browser safe-browsing.",
 strength:"Very compact. Constant-time operations.",
 limits:"Cannot enumerate. Cannot delete. False positives unavoidable.",
 pitfall:"Deleting from a standard Bloom filter clears bits that other items share. This creates false negatives.",
 question:"How many bits per item for a 1% false-positive rate?",
 answer:"About 9.6 bits. Independent of the item size.",
 demo:"bloom",sample:"alpha\nbeta\ngamma\ndelta\nepsilon\nzeta\neta\ntheta\n\nalpha\nbeta\nomega\npsi",refs:[
  ["Bloom, Space/Time Trade-offs in Hash Coding with Allowable Errors, CACM 1970","https://doi.org/10.1145/362686.362692"],
  ["Broder and Mitzenmacher, Network Applications of Bloom Filters: A Survey, Internet Mathematics 2004","https://doi.org/10.1080/15427951.2004.10129096"],
  ["Wikipedia, Bloom filter","https://en.wikipedia.org/wiki/Bloom_filter"]]},
{id:"cuckoo-quotient",title:"Cuckoo and quotient filters",level:4,kind:"Probabilistic",status:"Runnable teaching lab",
 summary:"Cuckoo filters store short fingerprints in two candidate buckets and support deletion. Quotient filters store the remainder of the hash in a compact open-addressed table.",
 mental:"Two bins per item, with eviction",
 mentalText:"Each item goes into one of two buckets. If both are full, kick one item to its alternate bucket.",
 steps:["Compute two candidate bucket indices for the item.","Store a fingerprint in one of them.","Insert may kick an existing fingerprint to its alternate bucket.","Query by checking both buckets for the fingerprint."],
 pseudo:"Cuckoo filter:\n  each item has a fingerprint f and two buckets i1, i2\n  i1 = h(key)\n  i2 = i1 XOR h(f)\n  insert:\n    if either bucket has space: place f\n    else: kick a random fingerprint, place f, recurse on the kicked\n  lookup: check both buckets for f\n  delete: remove f from its bucket\n\nQuotient filter:\n  store hash(key) as (quotient, remainder)\n  quotient = canonical slot\n  remainder stored compactly in a shifted run\n  supports insert, lookup, delete in O(1) amortized\n\nBoth support deletion, unlike Bloom.",
 uses:"Databases, caches, network switches, deduplication, storage systems.",
 strength:"Low false-positive rate. Deletion supported. Compact.",
 limits:"More complex than Bloom. Insert can fail if kicking loops.",
 pitfall:"Cuckoo filter insert can loop if the table is too full. Grow or rehash before that happens.",
 question:"What makes cuckoo filters support deletion?",
 answer:"Each item stores its own fingerprint in a specific bucket. Removing a fingerprint does not affect other items.",
 demo:"cuckoo",sample:"alpha\nbeta\ngamma\ndelta\nepsilon\nzeta\neta\ntheta\n\nalpha\nbeta\nomega",refs:[
  ["Fan, Andersen, Kaminsky, Mitzenmacher, Cuckoo Filter: Practically Better Than Bloom, CoNEXT 2014","https://doi.org/10.1145/2674005.2674994"],
  ["Bender et al., Don't Thrash: How to Cache Your Hash on Flash, VLDB 2012","https://doi.org/10.14778/2350229.2350275"],
  ["Wikipedia, Cuckoo filter","https://en.wikipedia.org/wiki/Cuckoo_filter"]]},

{id:"binary-trees",title:"Binary trees and traversals",level:2,kind:"Foundation",status:"Runnable teaching lab",
 summary:"A binary tree has nodes with at most two children. Traversals (preorder, inorder, postorder, level-order) visit nodes in different orders for different purposes.",
 mental:"A tree where each node has up to two branches",
 mentalText:"Preorder visits root first. Inorder visits left, root, right. Postorder visits children first. Level-order visits by depth.",
 steps:["Preorder: visit, then left, then right.","Inorder: left, visit, right.","Postorder: left, right, visit.","Level-order: use a queue to process by depth."],
 pseudo:"Node:\n  value\n  left, right\n\nTraversals (recursive):\n  preorder(n):  visit n; preorder(n.left); preorder(n.right)\n  inorder(n):   inorder(n.left); visit n; inorder(n.right)\n  postorder(n): postorder(n.left); postorder(n.right); visit n\n\nLevel-order:\n  queue = [root]\n  while queue:\n    n = queue.pop_front()\n    visit n\n    if n.left: queue.push_back(n.left)\n    if n.right: queue.push_back(n.right)\n\nProperties:\n  height h: up to 2^h - 1 nodes\n  full tree: every node has 0 or 2 children\n  complete tree: all levels full except possibly the last",
 uses:"Expression trees, parse trees, decision trees, BSTs, heaps, syntax trees.",
 strength:"Simple recursive structure. Natural for many problems.",
 limits:"Unbalanced trees degrade to lists.",
 pitfall:"Recursion depth. A skewed tree has depth n. Use iterative or balance.",
 question:"What traversal gives sorted order for a BST?",
 answer:"Inorder. Left subtree, then root, then right subtree visits keys in increasing order.",
 demo:"binary-tree",sample:"5 3 8 1 4 7 9",refs:[
  ["CLRS, Chapter 12 Binary Search Trees","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"],
  ["Knuth, TAOCP Vol. 1, Section 2.3","https://www-cs-faculty.stanford.edu/~knuth/taocp.html"],
  ["Sedgewick and Wayne, Algorithms, Section 3.2","https://algs4.cs.princeton.edu/home/"]]},
{id:"bst",title:"Binary search trees",level:3,kind:"Ordered",status:"Runnable teaching lab",
 summary:"A BST keeps keys in sorted order: for every node, all keys in the left subtree are smaller, all in the right subtree are larger. Search, insert and delete are O(h) where h is the height.",
 mental:"A sorted tree you can search by comparison",
 mentalText:"Start at the root. If the key is smaller, go left. If larger, go right. Repeat until you find it or reach a leaf.",
 steps:["Search: compare key with current node.","Go left if smaller, right if larger.","Insert at the position where search fails.","Delete: replace with successor or predecessor if two children."],
 pseudo:"search(node, key):\n  if node is None or node.key == key: return node\n  if key < node.key: return search(node.left, key)\n  return search(node.right, key)\n\ninsert(node, key):\n  if node is None: return Node(key)\n  if key < node.key: node.left = insert(node.left, key)\n  else: node.right = insert(node.right, key)\n  return node\n\ndelete(node, key):\n  # three cases:\n  # 0 children: remove\n  # 1 child: replace with the child\n  # 2 children: replace with in-order successor\n\nTime: O(h)\nh = log n if balanced, n if skewed",
 invariant:"Inorder traversal yields sorted order. The invariant must hold after every operation.",
 uses:"Ordered maps, ordered sets, priority search, database indexes, decision structures.",
 strength:"O(log n) on balanced trees. Ordered iteration.",
 limits:"O(n) worst case for skewed trees. No rebalancing built-in.",
 pitfall:"Inserting sorted data gives a chain of height n. Use a self-balancing variant.",
 question:"What is the height of a BST built from n random insertions?",
 answer:"Expected O(log n). But the worst case for sorted input is n.",
 demo:"bst",sample:"insert 5\ninsert 3\ninsert 8\ninsert 1\ninsert 4\nfind 4\nfind 7\ndelete 3\nprint",refs:[
  ["CLRS, Chapter 12 Binary Search Trees","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"],
  ["Knuth, TAOCP Vol. 3, Section 6.2.2","https://www-cs-faculty.stanford.edu/~knuth/taocp.html"],
  ["Wikipedia, Binary search tree","https://en.wikipedia.org/wiki/Binary_search_tree"]]},
{id:"avl",title:"AVL trees",level:4,kind:"Balanced BST",status:"Runnable teaching lab",
 summary:"An AVL tree is a BST that keeps the height difference between left and right subtrees at most 1. Rotations restore balance after insert and delete, giving O(log n) guarantees.",
 mental:"A BST that refuses to get lopsided",
 mentalText:"After every insert or delete, check the balance. If any node is out of balance, rotate.",
 steps:["Insert or delete as in BST.","Update heights up the path.","If a node's balance factor is outside [-1, 1], rotate.","Four cases: LL, RR, LR, RL."],
 pseudo:"balance factor = height(left) - height(right)\n\nRotations:\n  LL (left-left): right rotate\n  RR (right-right): left rotate\n  LR (left-right): left rotate left child, then right rotate\n  RL (right-left): right rotate right child, then left rotate\n\nTime:\n  search  O(log n)\n  insert  O(log n)\n  delete  O(log n)\n\nHeight bound:\n  h <= 1.44 log2(n + 2) - 0.33\n\nStrictly more balanced than red-black trees,\nbut more rotations on insert/delete.",
 uses:"Ordered maps, database indexes, real-time systems where strict balance matters.",
 strength:"Strict balance gives very fast lookups.",
 limits:"More rotations than red-black trees on insert/delete.",
 pitfall:"Height updates must be recomputed after every rotation. A stale height gives wrong balance factors.",
 question:"Which is more balanced, AVL or red-black?",
 answer:"AVL. AVL allows height difference up to 1; red-black allows up to 2x height difference.",
 demo:"avl",sample:"insert 10\ninsert 20\ninsert 30\ninsert 40\ninsert 50\ninsert 25\nprint",refs:[
  ["Adelson-Velsky and Landis, An algorithm for the organization of information, 1962","https://doi.org/10.1016/B978-0-08-011588-3.50006-4"],
  ["CLRS, problem 13-3 on AVL trees","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"],
  ["Wikipedia, AVL tree","https://en.wikipedia.org/wiki/AVL_tree"]]},
{id:"red-black",title:"Red-black trees",level:4,kind:"Balanced BST",status:"Runnable teaching lab",
 summary:"A red-black tree is a BST with a colour on each node. Five invariants guarantee the height is at most 2 log2(n+1). Insert and delete use recolouring and rotations.",
 mental:"A BST with two colours that keep the height in check",
 mentalText:"Red nodes cannot have red children. Every path from root to leaf has the same number of black nodes.",
 steps:["Insert as in BST, colour the new node red.","If it violates the red-red rule, recolour or rotate.","Delete with the standard BST algorithm, then fix black-height violations.","The tree stays balanced."],
 pseudo:"Invariants:\n  1. Every node is red or black\n  2. Root is black\n  3. Every leaf (nil) is black\n  4. Red node has black children\n  5. All paths from a node to its nil descendants have the same black height\n\nHeight bound: 2 log2(n + 1)\n\nInsert fix-up cases:\n  uncle red: recolour parent, uncle, grandparent\n  uncle black, triangle: rotate parent, then treat as line\n  uncle black, line: rotate grandparent\n\nDelete fix-up: more cases but same idea",
 uses:"Standard ordered maps (Java TreeMap, C++ std::map, Linux CFS scheduler).",
 strength:"Fewer rotations on insert/delete than AVL.",
 limits:"Slightly taller than AVL, so lookups are a bit slower.",
 pitfall:"The five invariants must hold after every operation. Bugs usually show up as black-height violations.",
 question:"Why do many standard libraries use red-black trees over AVL?",
 answer:"Fewer rotations on insert and delete. The slightly taller height is a small cost for typical workloads.",
 demo:"red-black",sample:"insert 10\ninsert 20\ninsert 30\ninsert 15\ninsert 25\nprint",refs:[
  ["Guibas and Sedgewick, A dichromatic framework for balanced trees, FOCS 1978","https://doi.org/10.1109/SFCS.1978.3"],
  ["CLRS, Chapter 13 Red-Black Trees","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"],
  ["Wikipedia, Red-black tree","https://en.wikipedia.org/wiki/Red%E2%80%93black_tree"]]},
{id:"treap-scapegoat",title:"Treaps and scapegoat trees",level:5,kind:"Balanced BST",status:"Runnable teaching lab",
 summary:"A treap is a BST on keys and a heap on random priorities, giving expected O(log n). A scapegoat tree rebuilds subtrees when they become unbalanced, giving amortized O(log n).",
 mental:"A BST with random tie-breakers, or a BST that rebuilds itself",
 mentalText:"Treaps assign a random priority to each node and rotate to keep the heap property. Scapegoats rebuild the whole subtree when it grows too deep.",
 steps:["Treap: insert as a leaf with a random priority, rotate up while priority > parent.","Scapegoat: track size and depth, rebuild the subtree when the size/depth ratio is too small.","Both achieve O(log n) expected or amortized."],
 pseudo:"Treap:\n  each node has key and priority (random)\n  BST on keys, max-heap on priorities\n  insert: leaf + rotations up\n  delete: rotate down to leaf, remove\n\nScapegoat:\n  track subtree sizes and node depth\n  when depth > log_{1/alpha}(size), rebuild the subtree\n  alpha = 2/3 typically\n\nBoth:\n  search O(log n)\n  insert O(log n) expected/amortized\n  delete O(log n) expected/amortized\n\nTreaps are simpler and randomized.\nScapegoats are deterministic amortized.",
 uses:"Ordered maps, split/merge operations (treaps), deterministic balancing (scapegoats).",
 strength:"Simple operations. Treaps support split and merge easily.",
 limits:"Treaps: randomized, worst case rare but possible. Scapegoats: amortized, so single operations can be slow.",
 pitfall:"Treap priorities must be independent and uniform. Correlated priorities break the heap property.",
 question:"What is a treap?",
 answer:"A tree that is simultaneously a BST on keys and a heap on random priorities. The heap ordering is what keeps it balanced.",
 demo:"treap",sample:"insert 5\ninsert 3\ninsert 8\ninsert 1\ninsert 4\nfind 4\ndelete 3\nprint",refs:[
  ["Aragon and Seidel, Randomized search trees, FOCS 1989","https://doi.org/10.1109/SFCS.1989.63516"],
  ["Galperin and Rivest, Scapegoat trees, SODA 1993","https://doi.org/10.1145/313559.313605"],
  ["Wikipedia, Treap","https://en.wikipedia.org/wiki/Treap"]]},

{id:"two-three-four",title:"2-3-4 trees",level:4,kind:"Multiway",status:"Concept lesson",
 summary:"A 2-3-4 tree is a balanced search tree where every node has 2, 3 or 4 children and 1, 2 or 3 keys. It is the conceptual model behind red-black trees.",
 mental:"A BST with nodes that hold multiple keys",
 mentalText:"Each node holds up to 3 keys and up to 4 children. The tree stays balanced because all leaves are at the same depth.",
 steps:["Insert: descend to a leaf.","If a node overflows (4 keys), split it before descending.","Promote the middle key to the parent.","The tree grows at the top when the root splits."],
 pseudo:"Properties:\n  every node has 1, 2 or 3 keys\n  a node with k keys has k+1 children\n  all leaves are at the same depth\n  keys are sorted within each node\n\nHeight: O(log n)\n\nInsert with preemptive splitting:\n  while descending, if a node is full (4 children):\n    split into two 2-nodes\n    promote the middle key to the parent\n  then insert at the leaf\n\nRed-black correspondence:\n  2-nodes = black node\n  3-nodes = black node + one red child\n  4-nodes = black node + two red children",
 uses:"Teaching red-black trees. Understanding the relationship between multiway trees and binary trees.",
 strength:"Conceptually clean balance. All leaves at the same depth.",
 limits:"Rarely used directly in practice; red-black trees are the standard binary version.",
 pitfall:"Preemptive splitting is what makes insertions top-down and clean. Inserting first then splitting is more complex.",
 question:"How many keys fit in a 4-node?",
 answer:"3 keys, with 4 children.",
 demo:"none",sample:"",refs:[
  ["Guibas and Sedgewick, A dichromatic framework for balanced trees, FOCS 1978","https://doi.org/10.1109/SFCS.1978.3"],
  ["CLRS, Chapter 18 B-Trees","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"],
  ["Sedgewick and Wayne, Algorithms, Section 3.3","https://algs4.cs.princeton.edu/home/"]]},
{id:"b-trees",title:"B-trees",level:4,kind:"Disk tree",status:"Runnable teaching lab",
 summary:"A B-tree is a multiway search tree optimized for disk access. Each node holds many keys, so the tree is short and the number of disk reads is small.",
 mental:"A wide, short tree",
 mentalText:"Instead of 2 children per node, a B-tree node holds hundreds of keys. The tree has height log_base_m(n).",
 steps:["Choose the order m (max children per node).","Insert with preemptive splitting on the way down.","Delete with merging and borrowing.","Every operation touches O(log_m n) nodes."],
 pseudo:"B-tree of order m:\n  - every node has at most m children\n  - every node except root has at least ceil(m/2) children\n  - root has at least 2 children if not a leaf\n  - all leaves at the same depth\n  - a node with k children has k-1 keys\n\nHeight: O(log_m n)\nDisk reads per operation: O(log_m n)\n\nWith m = 1000 and n = 10^9:\n  height is 3\n  so 3 disk reads per operation",
 uses:"Database indexes (SQLite, MySQL InnoDB, PostgreSQL), file systems (NTFS, HFS+, Btrfs), key-value stores.",
 strength:"Very few disk reads. Every operation is O(log n) with a small disk factor.",
 limits:"Complex to implement. Higher constant per node than a binary tree.",
 pitfall:"The minimum occupancy of non-root nodes must be maintained. Deleting without borrowing or merging breaks the B-tree invariant.",
 question:"How many disk reads for a search in a B-tree with m=1000 and n=10^9?",
 answer:"About 3. log_1000(10^9) is 3.",
 demo:"btree",sample:"10\ninsert 5\ninsert 3\ninsert 8\ninsert 1\ninsert 4\ninsert 7\nfind 7\nprint",refs:[

{id:"b-plus-trees",title:"B+ trees",level:4,kind:"Disk tree",status:"Runnable teaching lab",
 summary:"A B+ tree stores all keys in the leaves and uses internal nodes only for routing. The leaves are linked in order, so range queries are efficient.",
 mental:"A B-tree where data lives only in the leaves",
 mentalText:"Internal nodes hold separator keys. All data is in the leaves, which are linked left to right.",
 steps:["Internal nodes store only keys and pointers, not data.","All data records live in the leaves.","Leaves are linked in sorted order.","Search descends to a leaf. Range scans follow the leaf links."],
 pseudo:"B+ tree of order m:\n  - internal nodes: m-1 keys, m children\n  - leaves: hold data entries, linked list\n  - all leaves at the same depth\n\nSearch: descend to a leaf in O(log_m n)\nRange query:\n  1. Descend to the first leaf with keys >= low\n  2. Follow the leaf links until the last leaf with keys <= high\n\nTime: O(log_m n + k) for k results\n\nInsert: split leaf, promote the split key up\nDelete: merge or borrow to maintain minimum occupancy\n\nUsed by:\n  MySQL InnoDB\n  PostgreSQL\n  Oracle, SQL Server, SQLite\n  Most file systems",
 uses:"Almost every database index. Range scans and point queries both fast.",
 strength:"Excellent range queries. Sequential leaf scan uses disk prefetching efficiently.",
 limits:"More nodes than a B-tree because internal nodes store only keys.",
 pitfall:"Leaves are linked. Splits and merges must maintain the links, or range queries break.",
 question:"Why is a B+ tree better than a B-tree for range queries?",
 answer:"The leaves are linked, so a range query descends once and then scans the leaf list sequentially. B-trees require repeated traversal.",
 demo:"bplus",sample:"10\ninsert 5\ninsert 3\ninsert 8\ninsert 1\ninsert 4\ninsert 7\nfind 7\nrange 3 7\nprint",refs:[
  ["Comer, The ubiquitous B-tree, ACM Computing Surveys 1979","https://doi.org/10.1145/356770.356776"],
  ["Bayer and McCreight, Organization and maintenance of large ordered indices, 1972","https://doi.org/10.1007/BF00288683"],
  ["Wikipedia, B+ tree","https://en.wikipedia.org/wiki/B%2B_tree"]]},
{id:"tries-radix",title:"Tries and radix trees",level:3,kind:"String tree",status:"Runnable teaching lab",
 summary:"A trie stores strings by their characters. Each node represents a prefix. Lookup takes O(m) where m is the string length, independent of the number of stored strings.",
 mental:"A tree where each edge is a letter",
 mentalText:"The root is the empty string. From the root, one edge per possible first letter. Each subtree holds all strings starting with that prefix.",
 steps:["Insert: walk down the trie for each character.","Create nodes for missing characters.","Mark the last node as a word.","Search: walk down following the characters.","Radix: merge chains of single-child nodes."],
 pseudo:"Trie node:\n  children: map from character to TrieNode\n  is_end: bool\n\ninsert(word):\n  node = root\n  for ch in word:\n    if ch not in node.children: node.children[ch] = new node\n    node = node.children[ch]\n  node.is_end = True\n\nsearch(word):\n  node = root\n  for ch in word:\n    if ch not in node.children: return False\n    node = node.children[ch]\n  return node.is_end\n\nTime: O(m) per operation\nSpace: O(total characters)\n\nRadix trie (compressed):\n  edges labeled with substrings, not characters\n  reduces node count for sparse tries\n  used in IP routing (Patricia trie)",
 uses:"Autocomplete, spell check, IP routing (longest prefix match), predictive text, string dictionaries.",
 strength:"Prefix queries are natural. Lookup time independent of the number of stored strings.",
 limits:"Memory-heavy for large alphabets. Cache-unfriendly due to pointer chasing.",
 pitfall:"A plain trie wastes memory for large alphabets. Use a radix trie to compress.",
 question:"How much memory does a trie for 100,000 English words take?",
 answer:"Roughly 300,000 to 500,000 nodes. Several megabytes. A radix trie cuts this by 3 to 5 times.",
 demo:"trie",sample:"insert apple\ninsert app\ninsert apply\ninsert banana\ninsert band\ninsert bank\nsearch ap\nsearch apple\nsearch ban\nstarts_with ba",refs:[
  ["Fredkin, Trie memory, CACM 1960","https://doi.org/10.1145/367390.367400"],
  ["Knuth, TAOCP Vol. 3, Section 6.3","https://www-cs-faculty.stanford.edu/~knuth/taocp.html"],
  ["Wikipedia, Trie","https://en.wikipedia.org/wiki/Trie"]]},

{id:"binary-heap",title:"Binary heap",level:3,kind:"Priority queue",status:"Runnable teaching lab",
 summary:"A binary heap is a complete binary tree stored in an array where the parent is smaller (min-heap) or larger (max-heap) than its children. Insert and extract-min are O(log n).",
 mental:"A complete tree with a heap property",
 mentalText:"The root is the minimum (or maximum). Each parent is smaller (larger) than both children. The tree is complete so it fits in an array.",
 steps:["Store the heap in an array.","Parent of i is (i-1)/2.","Children of i are 2i+1 and 2i+2.","Insert: place at the end, sift up.","Extract-min: move the last element to the root, sift down."],
 pseudo:"Array representation:\n  parent(i) = (i - 1) // 2\n  left(i)   = 2*i + 1\n  right(i)  = 2*i + 2\n\ninsert(x):\n  heap.append(x)\n  sift_up(len(heap) - 1)\n\nextract_min():\n  min = heap[0]\n  heap[0] = heap[-1]\n  heap.pop()\n  sift_down(0)\n  return min\n\nsift_up(i):\n  while i > 0 and heap[parent(i)] > heap[i]:\n    swap(i, parent(i))\n    i = parent(i)\n\nsift_down(i):\n  while True:\n    smallest = i\n    l, r = 2*i+1, 2*i+2\n    if l < len(heap) and heap[l] < heap[smallest]: smallest = l\n    if r < len(heap) and heap[r] < heap[smallest]: smallest = r\n    if smallest == i: break\n    swap(i, smallest)\n    i = smallest\n\nBuild heap from n elements: O(n)\nInsert: O(log n)\nExtract-min: O(log n)\nPeek: O(1)",
 uses:"Priority queues, Dijkstra, heapsort, k-smallest, event scheduling.",
 strength:"Simple, cache-friendly (array-backed), good constants.",
 limits:"No efficient decrease-key or arbitrary delete by default.",
 pitfall:"Sift-down must go all the way. Stopping early breaks the heap property.",
 question:"Why is building a heap from n elements O(n) and not O(n log n)?",
 answer:"Most nodes are near the bottom and sift down only a few levels. The sum telescopes to O(n).",
 demo:"heap",sample:"push 5\npush 3\npush 8\npush 1\npush 4\npeek\npop\npop\nprint",refs:[
  ["Williams, Algorithm 232: Heapsort, CACM 1964","https://doi.org/10.1145/512274.512284"],
  ["CLRS, Chapter 6 Heapsort","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"],
  ["Wikipedia, Binary heap","https://en.wikipedia.org/wiki/Binary_heap"]]},
{id:"d-ary-heap",title:"d-ary heap",level:3,kind:"Priority queue",status:"Runnable teaching lab",
 summary:"A d-ary heap is a generalisation where each node has d children. Larger d gives shallower trees (faster insert) but slower sift-down.",
 mental:"A tree where each parent has d children",
 mentalText:"Common choice: d = 4, which often beats d = 2 on modern hardware because the tree is shallower and access patterns are still cache-friendly.",
 steps:["Parent of i is (i-1)/d.","Children of i are d*i + 1 through d*i + d.","Insert is O(log_d n) with sift-up.","Extract is O(d log_d n) because each level scans d children."],
 pseudo:"d-ary heap (d children per node):\n  parent(i) = (i - 1) // d\n  child_j(i) = d*i + j, j in 1..d\n\nInsert: O(log_d n)\nExtract-min: O(d log_d n)\n\nTrade-off:\n  larger d: faster insert, slower extract\n  smaller d: slower insert, faster extract\n\nOptimal d depends on the mix:\n  d = 2 to 4 is common\n  d = 4 often wins for extract-heavy workloads on modern CPUs",
 uses:"Priority queues, Dijkstra with many decrease-key operations, best-first search.",
 strength:"Tunable for the workload. d = 4 often beats binary heaps.",
 limits:"No asymptotic advantage over binary heaps.",
 pitfall:"Sift-down must compare all d children, not just two. Common bug: forgetting the loop over children.",
 question:"When is a d-ary heap better than a binary heap?",
 answer:"When inserts dominate (larger d makes them shallower) or when the cache benefit of shorter trees outweighs the wider sift-down scan.",
 demo:"dary",sample:"4\npush 5\npush 3\npush 8\npush 1\npush 4\npop\npop\nprint",refs:[
  ["Johnson, Priority queues with d-ary heaps, 1975","https://doi.org/10.1016/0020-0190(75)90001-6"],
  ["CLRS, problem 6-2 on d-ary heaps","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"],
  ["Wikipedia, d-ary heap","https://en.wikipedia.org/wiki/D-ary_heap"]]},
{id:"binomial-heap",title:"Binomial heap",level:5,kind:"Priority queue",status:"Concept lesson",
 summary:"A binomial heap is a forest of binomial trees. Merge is O(log n), insert is O(log n) amortized, extract-min is O(log n).",
 mental:"A collection of trees of different sizes",
 mentalText:"Each tree is a binomial tree of order k, holding 2^k nodes. A forest holds at most one tree per order.",
 steps:["Represent the heap as a linked list of binomial trees.","Each tree has order k and 2^k nodes.","Merge two heaps: merge the tree lists by order, then fix violations.","Insert: create a size-1 tree and merge.","Extract-min: find the min root, remove it, merge its children."],
 pseudo:"Binomial tree B_k:\n  B_0: single node\n  B_k: two B_{k-1}, one attached to the other\n  B_k has 2^k nodes and height k\n\nBinomial heap:\n  forest of trees with distinct orders\n  min pointer to the overall minimum\n\nmerge(h1, h2): O(log n)\ninsert(x):      O(log n) amortized\nfind_min():     O(1)\nextract_min():  O(log n)\ndecrease_key:   O(log n)\ndelete:         O(log n)\n\nNot as fast as Fibonacci in theory,\nbut simpler and often faster in practice.",
 uses:"Priority queues, algorithms that need merge (e.g., k-way merge, some graph algorithms).",
 strength:"Efficient merge. Simple structure.",
 limits:"Slower than Fibonacci heaps in theory. Not as cache-friendly as binary heaps.",
 pitfall:"The 'at most one tree per order' invariant is what makes merge efficient. Violating it corrupts the heap.",
 question:"Why do binomial heaps allow efficient merge?",
 answer:"Two heaps are merged by walking their tree lists in order of tree size. Only one tree per order is allowed, so the merge is O(log n).",
 demo:"none",sample:"",refs:[
  ["Vuillemin, A data structure for manipulating priority queues, CACM 1978","https://doi.org/10.1145/359460.359478"],
  ["CLRS, Chapter 19 Binomial Heaps","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"],
  ["Wikipedia, Binomial heap","https://en.wikipedia.org/wiki/Binomial_heap"]]},
{id:"fibonacci-pairing",title:"Fibonacci and pairing heaps",level:5,kind:"Priority queue",status:"Concept lesson",
 summary:"Fibonacci heaps support decrease-key in O(1) amortized, which speeds up Dijkstra. Pairing heaps are a simpler alternative with good practical performance.",
 mental:"Lazy priority queues",
 mentalText:"Fibonacci heaps delay restructuring. Trees are cut and linked only when needed. This makes some operations O(1) amortized.",
 steps:["Maintain a collection of trees.","Insert: add a single-node tree.","Decrease-key: cut the node and add to root list.","Extract-min: consolidate the root list by linking trees of the same degree."],

 limits:"High constant factors. Rarely fastest in practice.",
 pitfall:"The amortized analysis depends on consolidating the tree structure. Skipping it breaks the bounds.",
 question:"What is the asymptotically fastest known priority queue for Dijkstra?",
 answer:"Fibonacci heap: O(E + V log V). In practice, binary or d-ary heaps often win.",
 demo:"none",sample:"",refs:[
  ["Fredman and Tarjan, Fibonacci heaps and their uses in improved network optimization algorithms, JACM 1987","https://doi.org/10.1145/28869.28874"],
  ["Fredman, Sedgewick, Sleator, Tarjan, The pairing heap: a new form of self-adjusting heap, Algorithmica 1986","https://doi.org/10.1007/BF01840439"],

{id:"radix-soft-heap",title:"Radix and soft heaps",level:5,kind:"Priority queue",status:"Concept lesson",
 summary:"A radix heap supports monotone integer keys with very fast operations. A soft heap allows a bounded number of key corruptions to achieve O(1) amortized insert.",
 mental:"Heaps specialized for a specific pattern of keys",
 mentalText:"Radix heaps exploit integer keys and monotone extract-min. Soft heaps trade a small error for speed.",

{id:"prefix-sums",title:"Prefix sums",level:2,kind:"Range query",status:"Runnable teaching lab",
 summary:"Prefix sums precompute cumulative sums so that range-sum queries are O(1). Building takes O(n). Simple but the base of many others.",
 mental:"Running totals of the array",
 mentalText:"prefix[i] is the sum of the first i elements. Range sum [l, r) is prefix[r] - prefix[l].",
 steps:["prefix[0] = 0.","prefix[i] = prefix[i-1] + a[i-1].","query(l, r) = prefix[r] - prefix[l]."],
 pseudo:"build(a):\n  prefix = [0] * (n + 1)\n  for i in range(n): prefix[i+1] = prefix[i] + a[i]\n\nquery(l, r):  # sum of a[l..r-1]\n  return prefix[r] - prefix[l]\n\nTime:\n  build O(n)\n  query O(1)\n\nDoes not support point updates.\nFor updates, use a Fenwick tree or segment tree.",
 uses:"Range sum queries, image processing, dynamic programming speedups, 2D prefix sums for submatrix queries.",
 strength:"O(1) queries. Very simple.",
 limits:"Point updates require rebuilding or a Fenwick tree.",
 pitfall:"Off-by-one in the query. Use prefix[r] - prefix[l] for a[l..r-1].",
 question:"What is sum(a[2..4]) in prefix notation?",
 answer:"prefix[5] - prefix[2], because prefix[i] is the sum of the first i elements.",
 demo:"prefix",sample:"3 1 4 1 5 9 2 6\n2 5\n0 3\n4 8",refs:[
  ["Knuth, TAOCP Vol. 1 prefix sums","https://www-cs-faculty.stanford.edu/~knuth/taocp.html"],
  ["Bentley, Programming Pearls, Column 8","https://www.informit.com/store/programming-pearls-9780201657883"],
  ["cp-algorithms.com, Prefix sums","https://cp-algorithms.com/dynamic_programming/prefix-sums.html"]]},
{id:"fenwick",title:"Fenwick tree (binary indexed tree)",level:4,kind:"Range query",status:"Runnable teaching lab",
 summary:"A Fenwick tree supports point updates and prefix queries in O(log n) with O(n) space. It uses the binary representation of indices to define which ranges each node covers.",
 mental:"A tree defined by the lowest set bit of each index",
 mentalText:"Node i covers a range of size equal to the lowest set bit of i. Update climbs by adding the lowest set bit. Query descends by subtracting it.",
 steps:["Store tree[i] = sum of a[i - lowbit(i) + 1 .. i].","Update at i: add delta to tree[i], then i += lowbit(i), repeat.","Query prefix up to i: sum tree[i], then i -= lowbit(i), repeat."],
 pseudo:"lowbit(i) = i & (-i)\n\nbuild(a):\n  tree = [0] * (n + 1)\n  for i in range(1, n + 1):\n    tree[i] += a[i - 1]\n    j = i + lowbit(i)\n    if j <= n: tree[j] += tree[i]\n\nupdate(i, delta):  # 1-indexed\n  while i <= n:\n    tree[i] += delta\n    i += lowbit(i)\n\nquery(i):  # prefix sum of first i elements\n  s = 0\n  while i > 0:\n    s += tree[i]\n    i -= lowbit(i)\n  return s\n\nrange_query(l, r):\n  return query(r) - query(l - 1)\n\nTime:\n  build O(n)\n  update O(log n)\n  query O(log n)\n\nFaster and simpler than a segment tree for sum queries.",
 uses:"Point updates and prefix sums, competitive programming, dynamic prefix sum problems.",
 strength:"O(log n) operations with small constants and O(n) space.",
 limits:"Only invertible operations (sum, XOR). Non-invertible (min, max) need a segment tree.",
 pitfall:"Fenwick trees are 1-indexed. Off-by-one errors are common.",
 question:"How many nodes does a Fenwick tree for n elements have?",
 answer:"n + 1 (index 0 is unused).",
 demo:"fenwick",sample:"3 1 4 1 5 9 2 6\nquery 5\nupdate 2 10\nquery 5\nrange 2 5",refs:[
  ["Fenwick, A new data structure for cumulative frequency tables, Software 1994","https://doi.org/10.1002/spe.4380240306"],
  ["cp-algorithms.com, Fenwick tree","https://cp-algorithms.com/data_structures/fenwick.html"],
  ["Wikipedia, Fenwick tree","https://en.wikipedia.org/wiki/Fenwick_tree"]]},
{id:"segment-tree",title:"Segment tree",level:4,kind:"Range query",status:"Runnable teaching lab",
 summary:"A segment tree answers range queries (sum, min, max, ...) in O(log n) and supports point updates. It stores each range as a node in a balanced binary tree.",
 mental:"A tree where each node covers a range",
 mentalText:"The root covers the full array. Each node's two children split its range. A query visits O(log n) nodes.",
 steps:["Build the tree recursively.","Each node stores the aggregate of its range.","Query: descend, combining nodes that partition the query range.","Update: descend to the leaf, then update ancestors."],
 pseudo:"build(a, node, lo, hi):\n  if lo == hi:\n    tree[node] = a[lo]\n  else:\n    mid = (lo + hi) // 2\n    build(a, 2*node, lo, mid)\n    build(a, 2*node+1, mid+1, hi)\n    tree[node] = combine(tree[2*node], tree[2*node+1])\n\nquery(node, lo, hi, ql, qr):\n  if qr < lo or hi < ql: return identity\n  if ql <= lo and hi <= qr: return tree[node]\n  mid = (lo + hi) // 2\n  return combine(query(2*node, lo, mid, ql, qr),\n                 query(2*node+1, mid+1, hi, ql, qr))\n\nupdate(node, lo, hi, idx, val):\n  if lo == hi: tree[node] = val\n  else:\n    mid = (lo + hi) // 2\n    if idx <= mid: update(2*node, lo, mid, idx, val)\n    else: update(2*node+1, mid+1, hi, idx, val)\n    tree[node] = combine(tree[2*node], tree[2*node+1])\n\nSpace: O(4n) for the array-based version\nTime:\n  build O(n)\n  query O(log n)\n  update O(log n)\n\nCombines any associative operation,\nnot just sum. Works for min, max, gcd, etc.",
 uses:"Range queries, RMQ, range updates with lazy propagation, geometry (segment intersection counting).",
 strength:"General. Works for any associative operation.",
 limits:"O(4n) space. Higher constants than a Fenwick tree.",
 pitfall:"The tree array must be sized 4n to avoid out-of-bounds. Off-by-one in the recursion bounds.",
 question:"Why 4n for the segment tree array size?",
 answer:"The recursion tree has depth ceil(log2 n), and the array representation uses indices up to 4n. This is a safe upper bound.",
 demo:"segtree",sample:"3 1 4 1 5 9 2 6\nquery 2 5\nupdate 3 10\nquery 2 5\nquery 0 3",refs:[
  ["Bentley, Solutions to Klee's rectangle problems, 1977","https://en.wikipedia.org/wiki/Segment_tree"],
  ["cp-algorithms.com, Segment tree","https://cp-algorithms.com/data_structures/segment_tree.html"],
  ["Wikipedia, Segment tree","https://en.wikipedia.org/wiki/Segment_tree"]]},
{id:"lazy-propagation",title:"Lazy propagation",level:5,kind:"Range query",status:"Runnable teaching lab",
 summary:"Lazy propagation defers range updates until a node is actually queried. This makes range updates and range queries both O(log n) in a segment tree.",
 mental:"Postpone the update to the descendants until needed",
 mentalText:"When you update a range fully covered by a node, store the update at the node and do not descend. Only propagate when you need to visit the children.",
 steps:["Each node stores a pending update (lazy value).","Range update: if the node's range is fully covered, apply the update to the node and mark it lazy.","Otherwise, push the lazy value to children, then recurse.","Query: push the lazy value down before descending."],
 pseudo:"Each node stores:\n  value: aggregate of the range\n  lazy: pending update for children\n\npush(node):\n  if node.lazy is not identity:\n    apply lazy to children\n    children.lazy += node.lazy\n    node.lazy = identity\n\nrange_update(node, lo, hi, ql, qr, val):\n  if qr < lo or hi < ql: return\n  if ql <= lo and hi <= qr:\n    apply update to node\n    node.lazy += val\n    return\n  push(node)\n  recurse on children\n  node.value = combine(children)\n\nrange_query: similar, but push before descending\n\nTime: O(log n) for range update and range query",
 uses:"Range updates with range queries, flip/negate ranges, add to range and query max, painting intervals.",
 strength:"O(log n) for range updates. Enables many problems that would be O(n) per update.",
 limits:"Complex to implement. Bugs are common.",
 pitfall:"Forgetting to push lazy values before descending corrupts the tree. Always push before recursing.",
 question:"Why is lazy propagation needed for range updates?",
 answer:"Without it, updating a range would touch every element, costing O(n). Lazy defers and stores the update at the topmost covering node.",
 demo:"lazy",sample:"1 2 3 4 5\nadd 1 3 10\nsum 0 4\nsum 1 3\nadd 0 4 1\nsum 0 4",refs:[
  ["cp-algorithms.com, Segment tree with lazy propagation","https://cp-algorithms.com/data_structures/segment_tree.html"],
  ["Wikipedia, Lazy evaluation in segment trees","https://en.wikipedia.org/wiki/Segment_tree"],
  ["KACTL, Lazy segment tree","https://github.com/kth-competitive-programming/kactl"]]},
{id:"sparse-sqrt",title:"Sparse table and sqrt decomposition",level:4,kind:"Range query",status:"Runnable teaching lab",
 summary:"A sparse table answers idempotent range queries in O(1) with O(n log n) preprocessing. Sqrt decomposition uses O(sqrt n) blocks to balance update and query costs.",
 mental:"Precompute all power-of-two ranges, or use blocks of size sqrt n",
 mentalText:"Sparse table stores the answer for every interval of length 2^k. Sqrt decomposition stores aggregates per block.",
 steps:["Sparse: table[k][i] = aggregate of a[i..i+2^k-1]. Query combines two overlapping power-of-two ranges.","Sqrt: divide the array into blocks of size B. Each block has its aggregate. Query touches partial blocks and full blocks."],
 pseudo:"Sparse table:\n  table[0][i] = a[i]\n  table[k][i] = combine(table[k-1][i], table[k-1][i + 2^(k-1)])\n  query(l, r):\n    k = floor(log2(r - l + 1))\n    return combine(table[k][l], table[k][r - 2^k + 1])\n\nOnly works for idempotent operations (min, max, gcd).\n\nTime:\n  build O(n log n)\n  query O(1)\n  no updates\n\nSqrt decomposition:\n  block size B = sqrt(n)\n  block[i] = aggregate of a[i*B..(i+1)*B-1]\n  query(l, r): sum partial blocks + full blocks\n  update(i, val): update a[i] and block[i // B]\n\nTime:\n  query O(sqrt n)\n  update O(1)\n\nUse when the operation is not invertible and you need updates.",
 uses:"RMQ with no updates (sparse table), general range queries with updates (sqrt decomposition).",
 strength:"Sparse table: O(1) queries. Sqrt: simple, works for any operation.",
 limits:"Sparse: no updates. Sqrt: O(sqrt n) queries.",
 pitfall:"Sparse table only works for idempotent operations. Min and max are idempotent; sum is not (overlapping ranges double-count).",
 question:"Why does a sparse table work for min but not sum?",
 answer:"The two power-of-two ranges overlap. For min, overlapping does not change the answer. For sum, it double-counts.",
 demo:"sparse",sample:"3 1 4 1 5 9 2 6\nmin 2 5\nmin 0 3\nmax 1 6",refs:[
  ["Bender and Farach-Colton, The LCA problem revisited, LATIN 2000","https://doi.org/10.1007/10719839_9"],
  ["cp-algorithms.com, Sparse table","https://cp-algorithms.com/data_structures/sparse-table.html"],
  ["Wikipedia, Sparse table","https://en.wikipedia.org/wiki/Range_minimum_query#Solution_using_sparse_table"]]},

{id:"mos-algorithm",title:"Mo's algorithm",level:5,kind:"Offline queries",status:"Runnable teaching lab",
 summary:"Mo's algorithm answers many offline range queries in O((n + q) sqrt n) by sorting the queries so that adjacent queries share computation.",
 mental:"Sort the queries to minimize total movement",
 mentalText:"Sort queries by block of left endpoint, then by right endpoint. Move the current range to the next query while tracking the answer incrementally.",
 steps:["Sort queries by (left / block_size, right) with alternating direction.","Maintain the current range [cur_l, cur_r].","For each query, extend or shrink the range one step at a time, updating the answer.","Report the answer for the query."],
 pseudo:"block_size = int(sqrt(n))\n\nsort queries by:\n  (left // block_size, right if (left // block_size) % 2 == 0 else -right)\n\ncur_l, cur_r = 0, -1\ncurrent_answer = identity\nfor (ql, qr, idx) in queries:\n  while cur_l > ql: cur_l -= 1; add(cur_l)\n  while cur_r < qr: cur_r += 1; add(cur_r)\n  while cur_l < ql: remove(cur_l); cur_l += 1\n  while cur_r > qr: remove(cur_r); cur_r -= 1\n  answer[idx] = current_answer\n\nTime: O((n + q) * sqrt(n))\nMovement per block: O(n) for right, O(sqrt n) for left\nTotal: O((n + q) * sqrt n)\n\nGreat for problems where add and remove are O(1).",
 uses:"Range query problems with offline queries (distinct count, range mode, range median).",
 strength:"Simple. Often fast enough for 10^5 queries.",
 limits:"Offline only. Requires O(1) add and remove.",
 pitfall:"The alternating sort of right endpoints (Hilbert curve or block-alternating) roughly halves the constant. Without it, the algorithm is slower.",
 question:"Why does Mo's algorithm sort by block?",
 answer:"To bound the total movement. Right pointer moves O(n) per block, left pointer moves O(sqrt n) per query.",
 demo:"mos",sample:"1 1 2 3 2 1 4 5 1\nquery 0 4\nquery 1 5\nquery 2 7\nquery 0 8",refs:[
  ["Mo's algorithm, Mo Tao, 2009","https://en.wikipedia.org/wiki/Mo%27s_algorithm"],
  ["cp-algorithms.com, Mo's algorithm","https://cp-algorithms.com/data_structures/sqrt_decomposition.html#toc-tgt-4"],
  ["KACTL, Mo's algorithm","https://github.com/kth-competitive-programming/kactl"]]},
{id:"wavelet-tree",title:"Wavelet tree",level:5,kind:"Succinct",status:"Concept lesson",
 summary:"A wavelet tree is a balanced binary tree over the alphabet. It supports rank, select, range quantile and range counting in O(log sigma) time with n log sigma bits of space.",
 mental:"Recursively split the alphabet in half",
 mentalText:"At each node, split the alphabet into two halves. Store a bitmap that says which half each character belongs to. Recurse on the lower and upper halves.",
 steps:["Split the alphabet at the root.","Store a bitmap for the string: 0 for the lower half, 1 for the upper half.","Recurse on the two subsequences.","Rank and quantile queries walk down the tree."],
 pseudo:"build(s, alphabet):\n  if len(alphabet) <= 1: return leaf\n  mid = len(alphabet) // 2\n  lower = alphabet[:mid]\n  upper = alphabet[mid:]\n  bitmap = [1 if c in upper else 0 for c in s]\n  s_lower = [c for c in s if c in lower]\n  s_upper = [c for c in s if c in upper]\n  return Node(bitmap, build(s_lower, lower), build(s_upper, upper))\n\nrank(c, i): walk down to the leaf for c, using the bitmap\nselect(c, k): inverse of rank\nrange_count(l, r, c): rank(c, r) - rank(c, l)\nrange_quantile(l, r, k): walk down\n\nSpace: n log sigma bits\nTime: O(log sigma) per query",
 uses:"Range quantile, range mode, compressed text indexes, FM-index rank/select, bioinformatics.",
 strength:"Very compact. Supports many query types.",
 limits:"Building uses O(n log sigma) time.",
 pitfall:"Wavelet trees for very large alphabets use wavelet matrices. Standard wavelet tree is best for small alphabets.",
 question:"How much space does a wavelet tree use?",
 answer:"n log2(sigma) bits plus small rank/select overhead. For a DNA string (sigma=4) that is 2n bits per character.",
 demo:"none",sample:"",refs:[
  ["Grossi, Gupta, Vitter, High-order entropy-compressed text indexes, SODA 2003","https://doi.org/10.1145/644108.644250"],
  ["Navarro, Wavelet trees for all, JDA 2014","https://doi.org/10.1016/j.jda.2013.07.004"],
  ["Wikipedia, Wavelet tree","https://en.wikipedia.org/wiki/Wavelet_tree"]]},
{id:"persistent-seg",title:"Persistent segment tree",level:5,kind:"Persistent",status:"Concept lesson",
 summary:"A persistent segment tree keeps all previous versions after updates by copying only the O(log n) nodes on the path. It supports range queries on any version.",
 mental:"A tree that remembers every update",
 mentalText:"Each update creates a new root. Only the nodes on the update path are copied. Unchanged subtrees are shared with the previous version.",
 steps:["Build the initial tree.","Each update creates a new root and copies the O(log n) nodes on the path.","Unchanged siblings are shared with the previous version.","Query on any version uses its root."],
 pseudo:"update(prev_node, lo, hi, idx, val):\n  new_node = copy(prev_node)\n  if lo == hi: new_node.value = val\n  else:\n    mid = (lo + hi) // 2\n    if idx <= mid:\n      new_node.left = update(prev_node.left, lo, mid, idx, val)\n    else:\n      new_node.right = update(prev_node.right, mid+1, hi, idx, val)\n    new_node.value = combine(new_node.left, new_node.right)\n  return new_node\n\nEach update creates O(log n) new nodes.\nAll previous versions remain valid.\n\nSpace: O(n + q log n) for q updates\nQuery: O(log n) per version\n\nUsed for:\n  k-th smallest in range\n  range count of a value in historical versions\n  persistent arrays, persistent queues",
 uses:"Versioned data, time travel queries, k-th smallest in range.",
 strength:"All versions available at once. O(log n) per operation.",
 limits:"O(log n) new nodes per update. Memory grows with the number of updates.",
 pitfall:"Copying the node before modifying is essential. Modifying in place corrupts old versions.",
 question:"How many new nodes does one persistent update create?",
 answer:"O(log n). Only the path from root to the updated leaf.",
 demo:"none",sample:"",refs:[
  ["Driscoll, Sarnak, Sleator, Tarjan, Making data structures persistent, JCSS 1989","https://doi.org/10.1016/0022-0000(89)90034-2"],
  ["cp-algorithms.com, Persistent segment tree","https://cp-algorithms.com/data_structures/segment_tree.html#toc-tgt-12"],
  ["Wikipedia, Persistent data structure","https://en.wikipedia.org/wiki/Persistent_data_structure"]]},
{id:"order-statistic",title:"Order-statistic trees",level:4,kind:"Augmented tree",status:"Runnable teaching lab",
 summary:"An order-statistic tree is a balanced BST where each node stores the size of its subtree. It supports rank and select in O(log n).",
 mental:"A tree where every node knows how many nodes are below it",
 mentalText:"Each node stores its subtree size. To find the k-th smallest, compare k with the left subtree size and descend.",
 steps:["Augment each node with subtree size.","Rank(x): count nodes smaller than x by walking the tree.","Select(k): descend, comparing k with left subtree sizes.","Update subtree sizes on insert and delete."],
 pseudo:"Node has:\n  key\n  left, right\n  size\n  (optional) colour, priority, ...\n\nrank(x):  # number of keys < x\n  count = 0\n  node = root\n  while node:\n    if x <= node.key:\n      node = node.left\n    else:\n      count += 1 + (node.left.size if node.left else 0)\n      node = node.right\n  return count\n\nselect(k):  # k-th smallest (0-indexed)\n  node = root\n  while node:\n    left_size = node.left.size if node.left else 0\n    if k == left_size: return node.key\n    if k < left_size: node = node.left\n    else: k -= left_size + 1; node = node.right\n\nTime: O(log n) per operation",
 uses:"Rank and select queries, k-th smallest, order statistics, interval counting.",
 strength:"O(log n) for both rank and select.",
 limits:"Needs a balanced tree as the base.",
 pitfall:"Subtree sizes must be updated on every rotation, insert and delete. Forgetting this corrupts the tree.",
 question:"What does rank(x) return?",
 answer:"The number of keys strictly smaller than x. Or, in some conventions, the position of x in sorted order.",
 demo:"order-stat",sample:"insert 5\ninsert 3\ninsert 8\ninsert 1\ninsert 4\nselect 2\nrank 5\nselect 0",refs:[
  ["CLRS, Chapter 14 Augmenting Data Structures","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"],
  ["Sedgewick and Wayne, Algorithms, Section 3.2","https://algs4.cs.princeton.edu/home/"],
  ["Wikipedia, Order statistic tree","https://en.wikipedia.org/wiki/Order_statistic_tree"]]},
/* Chapter 8 */
{id:"union-find",title:"Union-find (Disjoint Set Union)",level:3,kind:"Disjoint sets",status:"Runnable teaching lab",
 summary:"Union-find tracks which elements are in the same set. Union merges two sets. Find returns the representative. With path compression and union by rank it is nearly O(1) amortized.",
 mental:"A forest where each tree is one set",
 mentalText:"Every element points to a parent. The root is the representative. Union attaches one root under another. Path compression flattens the tree.",
 steps:["Initialize: each element is its own parent.","Find: follow parent pointers to the root.","Path compression: point every visited node to the root.","Union: attach the smaller tree under the larger.","Track size or rank to keep trees shallow."],
 pseudo:"parent = list(range(n))\nrank = [0] * n\n\ndef find(x):\n  if parent[x] != x:\n    parent[x] = find(parent[x])   # path compression\n  return parent[x]\n\ndef union(a, b):\n  ra, rb = find(a), find(b)\n  if ra == rb: return False\n  if rank[ra] < rank[rb]: ra, rb = rb, ra\n  parent[rb] = ra\n  if rank[ra] == rank[rb]: rank[ra] += 1\n  return True\n\nAmortized time per operation: O(alpha(n)) ~= O(1)\nalpha is the inverse Ackermann function\nFor any practical n, alpha(n) <= 4",
 uses:"Kruskal's MST, image connected components, dynamic connectivity, percolation, union of overlapping intervals.",
 strength:"Nearly O(1) amortized. Very simple.",
 limits:"No efficient split. Only merges.",
 pitfall:"Union without rank or size gives O(n) chains. Path compression alone without union by rank still gives O(log n) amortized, but combining both gives O(alpha(n)).",
 question:"What is the amortized time per union-find operation?",
 answer:"O(alpha(n)), where alpha is the inverse Ackermann function. For practical n it is at most 4.",
 demo:"union-find",sample:"union 0 1\nunion 2 3\nfind 1\nfind 3\nunion 1 3\nfind 3\nconnected 0 3\nconnected 0 4",refs:[
  ["Tarjan, Efficiency of a good but not linear set union algorithm, JACM 1975","https://doi.org/10.1145/321879.321884"],
  ["Tarjan and van Leeuwen, Worst-case analysis of set union algorithms, JACM 1984","https://doi.org/10.1145/62.2160"],
  ["CLRS, Chapter 19 Data Structures for Disjoint Sets","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"]]},
{id:"rollback-dsu",title:"Rollback DSU",level:5,kind:"Disjoint sets",status:"Concept lesson",
 summary:"A rollback DSU supports undo of the last union. It does not use path compression (which would break rollback) but still uses union by size for O(log n) operations.",
 mental:"A union-find that can undo the last merge",
 mentalText:"Without path compression, the tree structure is a log. Every union is recorded so it can be reversed.",
 steps:["Union without path compression, but with union by size.","Record the changes (parent, size) in a stack.","To rollback, pop the stack and restore the changes."],
 pseudo:"History stack records:\n  (child_root, old_parent_of_child)\n  (parent_root, old_size)\n\nunion(a, b):\n  ra, rb = find(a), find(b)\n  if ra == rb: return\n  if size[ra] < size[rb]: ra, rb = rb, ra\n  history.append((rb, parent[rb], ra, size[ra]))\n  parent[rb] = ra\n  size[ra] += size[rb]\n\nrollback():\n  rb, old_parent, ra, old_size = history.pop()\n  parent[rb] = old_parent\n  size[ra] = old_size\n\nTime: O(log n) per operation\nNo path compression, so trees can be taller.",
 uses:"Offline dynamic connectivity, Mo's algorithm on trees, algorithms that need undo.",
 strength:"Supports rollback in O(1).",
 limits:"Slower than full union-find because path compression is disabled.",
 pitfall:"Path compression cannot be used with rollback. Any parent pointer change must be recorded.",
 question:"Why can't path compression be used with rollback DSU?",
 answer:"Path compression modifies parent pointers during find. Those changes would need to be recorded and undone, which is expensive.",
 demo:"rollback-dsu",sample:"union 0 1\nunion 2 3\nsnapshot\nunion 1 3\nfind 3\nrollback\nfind 3",refs:[
  ["Sleator and Tarjan, A data structure for dynamic trees, JCSS 1983","https://doi.org/10.1016/0022-0000(83)90006-5"],
  ["cp-algorithms.com, Disjoint Set Union with rollback","https://cp-algorithms.com/data_structures/disjoint_set_union.html"],
  ["KACTL, Rollback DSU","https://github.com/kth-competitive-programming/kactl"]]},
{id:"link-cut",title:"Link-cut trees",level:5,kind:"Dynamic tree",status:"Concept lesson",
 summary:"A link-cut tree maintains a forest under link and cut operations and supports path queries. Each operation is O(log n) amortized.",
 mental:"Dynamic trees with fast path queries",
 mentalText:"Represent each tree as a set of preferred paths stored in splay trees. Access moves a node to the root of its preferred path, giving O(log n) amortized.",
 steps:["Represent the forest as splay trees of preferred paths.","access(v): make the path from root to v preferred.","link(u, v): attach u as a child of v.","cut(u): disconnect u from its parent."],
 pseudo:"Link-cut tree operations:\n  access(v):  O(log n) amortized\n  find_root(v): O(log n) amortized\n  link(u, v): O(log n) amortized\n  cut(u):     O(log n) amortized\n  path_query(u, v): access(u); access(v); query\n\nUsed for:\n  dynamic connectivity\n  dynamic MST\n  path max/min/sum queries\n  network flow (some variants)",
 uses:"Dynamic graph algorithms, network flows, dynamic trees, competitive programming.",
 strength:"O(log n) amortized for everything.",
 limits:"Complex to implement correctly. Splay trees are subtle.",
 pitfall:"The access operation is the heart of the structure. Bugs in access break everything.",
 question:"What does access(v) do?",
 answer:"It makes the path from the tree root to v a preferred path, so v becomes the root of its splay tree and further operations are fast.",
 demo:"none",sample:"",refs:[
  ["Sleator and Tarjan, A data structure for dynamic trees, JCSS 1983","https://doi.org/10.1016/0022-0000(83)90006-5"],
  ["cp-algorithms.com, Link-cut tree","https://cp-algorithms.com/data_structures/link_cut_tree.html"],
  ["Wikipedia, Link-cut tree","https://en.wikipedia.org/wiki/Link/cut_tree"]]},
{id:"euler-tour",title:"Euler-tour trees",level:5,kind:"Dynamic tree",status:"Concept lesson",
 summary:"An Euler-tour tree represents a tree as an Euler tour of its edges. Link, cut and subtree queries are O(log n) using a balanced BST.",
 mental:"A tree stored as a tour",
 mentalText:"The Euler tour visits each edge twice. Storing this tour in a balanced BST lets link and cut be expressed as split and join.",
 steps:["Build the Euler tour of the tree.","Store the tour in a balanced BST.","Link: join the tours at the right positions.","Cut: split the tour at the edge.","Subtree query: find the segment of the tour between first and last occurrence of the node."],
 pseudo:"Euler tour tree:\n  tour = sequence of 2n entries (each edge appears twice)\n  balanced BST over the tour\n\nlink(u, v):\n  find occurrence of u in u's tour\n  find occurrence of v in v's tour\n  rotate and join the two tours\n\ncut(u, v):\n  split the tour at the edge (u, v)\n\nsubtree_query(v):\n  find segment between first and last occurrences of v\n  query over that range\n\nTime: O(log n) per operation",
 uses:"Dynamic trees, dynamic connectivity, dynamic subtree queries.",
 strength:"All operations in O(log n).",
 limits:"Requires a balanced BST with split and join. Complex.",
 pitfall:"Each node appears twice in the tour. Subtree queries use the range between the two occurrences.",
 question:"How many entries does the Euler tour of an n-node tree have?",
 answer:"2(n-1) if you only record edges. 2n if you also record node entries.",
 demo:"none",sample:"",refs:[
  ["Henzinger and King, Randomized dynamic graph algorithms with polylogarithmic time per operation, STOC 1995","https://doi.org/10.1145/225058.225269"],
  ["Sleator and Tarjan, A data structure for dynamic trees, JCSS 1983","https://doi.org/10.1016/0022-0000(83)90006-5"],
  ["Wikipedia, Euler tour technique","https://en.wikipedia.org/wiki/Euler_tour_technique"]]},
